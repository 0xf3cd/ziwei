[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ziwei"
version = "0.0.0"
description = "紫微斗数排盘与有出处的知识（开发中）"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "celestial-calendar==0.8.0",
  "tzdata==2026.5",
]

[project.urls]
Repository = "https://github.com/0xf3cd/ziwei"
Issues = "https://github.com/0xf3cd/ziwei/issues"

[dependency-groups]
dev = [
  "build==1.6.1",
  "markdown-it-py==4.2.0",
  "mypy==2.4.0",
  "myst-parser==5.1.0",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "pyyaml==6.0.3",
  "ruff==0.17.1",
  "setuptools==84.0.0",
  "sphinx==8.2.3; python_version < '3.12'",
  "sphinx==9.1.0; python_version >= '3.12'",
  "twine==7.0.0",
  "types-pyyaml==6.0.12.20260906",
]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
ziwei = ["py.typed"]

[tool.ruff]
target-version = "py311"
indent-width = 2
line-length = 100
extend-exclude = [".review"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF", "S101"]
allowed-confusables = ["，", "：", "（", "）", "；", "！", "？"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
explicit_package_bases = true
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"
files = ["src", "tools", "tests", "docs/conf.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-config --strict-markers --import-mode=importlib"
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["src/ziwei", "tools"]

[tool.coverage.report]
show_missing = true
