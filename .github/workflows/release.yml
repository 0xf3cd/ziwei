name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Candidate version already committed on main
        required: true
        type: string
      sha:
        description: Full lowercase SHA of the latest main commit when dispatching
        required: true
        type: string

permissions: {}

concurrency:
  group: ziwei-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_SHA: ${{ inputs.sha }}
    outputs:
      version: ${{ steps.release.outputs.version }}
      source_sha: ${{ steps.release.outputs.source_sha }}
      sdist_name: ${{ steps.release.outputs.sdist_name }}
      wheel_name: ${{ steps.release.outputs.wheel_name }}
      sdist_sha256: ${{ steps.release.outputs.sdist_sha256 }}
      wheel_sha256: ${{ steps.release.outputs.wheel_sha256 }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.5"
          checksum: "68a509da24b06b4223a1c0175fb5eb5bc79342b76cbeff0cfe51ac3f5b17b6b2"
          enable-cache: false
      - run: uv sync --locked --python 3.14
      - name: Check source checkout
        run: &verify-source |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=all)"
          git diff --exit-code "$GITHUB_SHA" --
      - run: uv run --locked python tools/release.py validate
      - run: uv run --locked python tools/check.py --artifacts-dir dist
        env:
          SCRATCH: ${{ runner.temp }}
      - name: Check source remained unchanged
        run: *verify-source
      - id: release
        run: uv run --locked python tools/release.py prepare
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ziwei-${{ steps.release.outputs.version }}-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
          overwrite: false
          retention-days: 14

  consume:
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
            checksum: "68a509da24b06b4223a1c0175fb5eb5bc79342b76cbeff0cfe51ac3f5b17b6b2"
          - os: ubuntu-latest
            python: "3.12"
            checksum: "68a509da24b06b4223a1c0175fb5eb5bc79342b76cbeff0cfe51ac3f5b17b6b2"
          - os: ubuntu-latest
            python: "3.13"
            checksum: "68a509da24b06b4223a1c0175fb5eb5bc79342b76cbeff0cfe51ac3f5b17b6b2"
          - os: ubuntu-latest
            python: "3.14"
            checksum: "68a509da24b06b4223a1c0175fb5eb5bc79342b76cbeff0cfe51ac3f5b17b6b2"
          - os: ubuntu-24.04-arm
            python: "3.14"
            checksum: "9bf43b4d1a07665bf64d4c4e710930b382321a785e0eb10aac07f46471f86a31"
          - os: macos-latest
            python: "3.14"
            checksum: "5bb0e5fe008a773c3dbcb97ff79cd89e1241464fe9d2f986d52ad8f1b037bd62"
          - os: windows-latest
            python: "3.14"
            checksum: "4c4d49d8738847d9b71ba319e49a5688c93eac0fe6204b1df24e98528dddf39a"
    env:
      RELEASE_VERSION: ${{ needs.build.outputs.version }}
      RELEASE_SHA: ${{ needs.build.outputs.source_sha }}
      SDIST_SHA256: ${{ needs.build.outputs.sdist_sha256 }}
      WHEEL_SHA256: ${{ needs.build.outputs.wheel_sha256 }}
      PYTHON_VERSION: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.5"
          checksum: ${{ matrix.checksum }}
          enable-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: dist
          digest-mismatch: error
      - run: uv sync --locked --python "$PYTHON_VERSION"
        shell: bash
      - run: uv run --locked python tools/release.py consume
        env:
          SCRATCH: ${{ runner.temp }}

  publish-testpypi:
    if: github.ref == 'refs/heads/main'
    needs: [build, consume]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: dist
          digest-mismatch: error
      - name: Verify exact publish bytes
        id: verify-bytes
        shell: bash
        env:
          DIST_DIR: dist
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          SDIST_NAME: ${{ needs.build.outputs.sdist_name }}
          WHEEL_NAME: ${{ needs.build.outputs.wheel_name }}
          SDIST_SHA256: ${{ needs.build.outputs.sdist_sha256 }}
          WHEEL_SHA256: ${{ needs.build.outputs.wheel_sha256 }}
        run: &verify-publish-bytes |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$SDIST_NAME" == "ziwei-${RELEASE_VERSION}.tar.gz" ]]
          [[ "$WHEEL_NAME" == "ziwei-${RELEASE_VERSION}-py3-none-any.whl" ]]
          [[ "$SDIST_SHA256" =~ ^[0-9a-f]{64}$ && "$WHEEL_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ -d "$DIST_DIR" && ! -L "$DIST_DIR" ]]
          [[ -d "$DIST_DIR/packages" && ! -L "$DIST_DIR/packages" ]]
          [[ $(find "$DIST_DIR/packages" -mindepth 1 -maxdepth 1 | wc -l) -eq 2 ]]
          [[ -f "$DIST_DIR/packages/$SDIST_NAME" && ! -L "$DIST_DIR/packages/$SDIST_NAME" ]]
          [[ -f "$DIST_DIR/packages/$WHEEL_NAME" && ! -L "$DIST_DIR/packages/$WHEEL_NAME" ]]
          printf '%s  %s\n' "$SDIST_SHA256" "$DIST_DIR/packages/$SDIST_NAME" \
            "$WHEEL_SHA256" "$DIST_DIR/packages/$WHEEL_NAME" | sha256sum --check --strict
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/packages
          attestations: true
          skip-existing: false

  verify-testpypi:
    needs: [build, publish-testpypi]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.build.outputs.version }}
      RELEASE_SHA: ${{ needs.build.outputs.source_sha }}
      SDIST_SHA256: ${{ needs.build.outputs.sdist_sha256 }}
      WHEEL_SHA256: ${{ needs.build.outputs.wheel_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.5"
          checksum: "68a509da24b06b4223a1c0175fb5eb5bc79342b76cbeff0cfe51ac3f5b17b6b2"
          enable-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: dist
          digest-mismatch: error
      - run: uv sync --locked --python 3.14
      - run: uv run --locked python tools/release.py verify-testpypi
        env:
          SCRATCH: ${{ runner.temp }}

  publish-pypi:
    if: github.ref == 'refs/heads/main'
    needs: [build, consume, verify-testpypi]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: dist
          digest-mismatch: error
      - name: Verify exact publish bytes
        id: verify-bytes
        shell: bash
        env:
          DIST_DIR: dist
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          SDIST_NAME: ${{ needs.build.outputs.sdist_name }}
          WHEEL_NAME: ${{ needs.build.outputs.wheel_name }}
          SDIST_SHA256: ${{ needs.build.outputs.sdist_sha256 }}
          WHEEL_SHA256: ${{ needs.build.outputs.wheel_sha256 }}
        run: *verify-publish-bytes
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://upload.pypi.org/legacy/
          packages-dir: dist/packages
          attestations: true
          skip-existing: false
